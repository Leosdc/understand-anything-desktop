name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Clone and build plugin core
        run: |
          git clone https://github.com/Lum1104/Understand-Anything.git ../understand-anything-plugin
          cd ../understand-anything-plugin
          pnpm install
          pnpm --filter @understand-anything/core build
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Desktop App
        run: npm run build
