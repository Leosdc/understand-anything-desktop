name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clone and build plugin core
        run: |
          git clone https://github.com/Leosdc/Understand-Anything.git temp-plugin
          cd temp-plugin/understand-anything-plugin/packages/core
          npm install
          npx tsc
          mkdir -p ../../../../packages/core
          cp -r dist ../../../../packages/core/dist
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Desktop App
        run: npm run build
